# Project-wide Gradle settings for SamVideo
# Optimized for fast project import, responsive Gradle sync, and parallel building in Android Studio.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Enables parallel execution of decoupled project tasks.
org.gradle.parallel=true

# Enables build caching and configuration caching for instant incremental builds.
org.gradle.caching=true
org.gradle.configuration-cache=true

# Enables file system watching for responsive builds.
org.gradle.vfs.watch=true

# Maximum workers
org.gradle.workers.max=4

# AndroidX and resource namespacing optimization
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin compiler settings
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process

# Graceful Google Services handling
googleServices.missing.passthrough=true
